services:
  retrain:
    build: .
    image: soar-ai-retrain:1.0
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /state
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8002}:8000"
    volumes:
      - retrain_state:/state
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  retrain_state:
